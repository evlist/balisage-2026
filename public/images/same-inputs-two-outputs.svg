<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Same inputs, two outputs</title>
  <desc id="desc">The same GPX and subtitle inputs produce a guide for walkers and a story for friends.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.2" />
    </filter>
    <filter id="arrow-glow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#ffffff" flood-opacity="0.42" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#f3f6f5" />
    </marker>
  </defs>
  <g fill="none" stroke="#f3f6f5" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#arrow-glow)">
    <path d="M322 182C400 150 475 143 548 161" />
    <path d="M322 238C400 270 475 277 548 259" />
  </g>
  <g font-family="Georgia, serif" fill="#28312d" text-anchor="middle">
    <g transform="translate(178 210)">
      <g transform="translate(-76 -36) rotate(-7) scale(0.52)" filter="url(#shadow)">
        <path d="M-96-118H48l48 48v188H-96z" fill="#fff" stroke="#28312d" stroke-width="8" stroke-linejoin="round" />
        <path d="M48-118v48h48" fill="none" stroke="#b9c4bf" stroke-width="7" stroke-linejoin="round" />
        <text y="-15" font-size="56" font-weight="700">.srt</text>
        <text y="48" font-size="30">subtitles</text>
      </g>
      <g transform="translate(28 -8) rotate(4) scale(0.52)" filter="url(#shadow)">
        <path d="M-96-118H48l48 48v188H-96z" fill="#fff" stroke="#28312d" stroke-width="8" stroke-linejoin="round" />
        <path d="M48-118v48h48" fill="none" stroke="#b9c4bf" stroke-width="7" stroke-linejoin="round" />
        <path d="M-40 20c18-80 75-80 94-4" fill="none" stroke="#1f6f5e" stroke-width="9" stroke-linecap="round" />
        <circle cx="-40" cy="20" r="9" fill="#1f6f5e" />
        <circle cx="54" cy="16" r="9" fill="#1f6f5e" />
        <text y="-42" font-size="56" font-weight="700">.gpx</text>
        <text y="76" font-size="30">tracks</text>
      </g>
      <g transform="translate(-20 74) rotate(-2) scale(0.52)" filter="url(#shadow)">
        <rect x="-116" y="-110" width="232" height="220" rx="18" fill="#fff" stroke="#28312d" stroke-width="8" />
        <path d="M-62-32h124M-62 8h124M-62 48h82" stroke="#87928d" stroke-width="9" stroke-linecap="round" />
        <text y="-64" font-size="40" font-weight="700">prompt</text>
      </g>
      <text y="-132" font-size="30" font-weight="700">same inputs</text>
    </g>
    <g transform="translate(690 142) rotate(2)">
      <rect x="-132" y="-70" width="264" height="140" rx="16" fill="#fff" stroke="#1f6f5e" stroke-width="8" />
      <text y="-12" font-size="38" font-weight="700">guide</text>
      <text y="35" font-size="30">for walkers</text>
    </g>
    <g transform="translate(690 278) rotate(-2)">
      <rect x="-132" y="-70" width="264" height="140" rx="16" fill="#fff" stroke="#b94d3f" stroke-width="8" />
      <text y="-12" font-size="38" font-weight="700">story</text>
      <text y="35" font-size="30">for friends</text>
    </g>
  </g>
</svg>