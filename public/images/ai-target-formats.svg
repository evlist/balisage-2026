<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">AI targets different formats</title>
  <desc id="desc">The same content flows through AI and is output as web, print and PDF formats.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#f3f6f5" />
    </marker>
  </defs>

  <g font-family="Georgia, serif" text-anchor="middle" fill="#28312d">
    <rect x="70" y="128" width="220" height="164" rx="22" fill="#fff" stroke="#28312d" stroke-width="8" />
    <text x="180" y="222" font-size="38" font-weight="700">content</text>

    <rect x="340" y="96" width="220" height="228" rx="26" fill="#fff" stroke="#1f6f5e" stroke-width="9" />
    <circle cx="450" cy="178" r="50" fill="none" stroke="#1f6f5e" stroke-width="8" />
    <path d="M450 118v18M450 220v18M392 178h18M490 178h18M410 138l12 12M478 206l12 12M490 138l-12 12M422 206l-12 12" stroke="#1f6f5e" stroke-width="7" stroke-linecap="round" />
    <text x="450" y="288" font-size="44" font-weight="700">AI</text>

    <rect x="640" y="64" width="190" height="86" rx="14" fill="#fff" stroke="#1f6f5e" stroke-width="7" />
    <text x="735" y="117" font-size="34" font-weight="700">web</text>

    <rect x="640" y="166" width="190" height="86" rx="14" fill="#fff" stroke="#b94d3f" stroke-width="7" />
    <text x="735" y="219" font-size="34" font-weight="700">print</text>

    <rect x="640" y="268" width="190" height="86" rx="14" fill="#fff" stroke="#87928d" stroke-width="7" />
    <text x="735" y="321" font-size="34" font-weight="700">PDF</text>
  </g>

  <g fill="none" stroke="#f3f6f5" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M292 210H332" />
    <path d="M562 150H632" />
    <path d="M562 210H632" />
    <path d="M562 310H632" />
  </g>
</svg>
