<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">AI generates content from subtitles and GPX tracks</title>
  <desc id="desc">Subtitles, GPX tracks and prompts feed an AI block that outputs HTML content.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#f3f6f5" />
    </marker>
  </defs>

  <g font-family="Georgia, serif" text-anchor="middle" fill="#28312d">
    <rect x="70" y="82" width="190" height="78" rx="14" fill="#fff" stroke="#28312d" stroke-width="7" />
    <text x="165" y="128" font-size="28" font-weight="700">subtitles</text>

    <rect x="70" y="174" width="190" height="78" rx="14" fill="#fff" stroke="#28312d" stroke-width="7" />
    <text x="165" y="220" font-size="28" font-weight="700">GPX tracks</text>

    <rect x="70" y="266" width="190" height="78" rx="14" fill="#fff" stroke="#28312d" stroke-width="7" />
    <text x="165" y="312" font-size="28" font-weight="700">prompts</text>

    <rect x="336" y="110" width="230" height="220" rx="26" fill="#fff" stroke="#1f6f5e" stroke-width="9" />
    <circle cx="451" cy="184" r="44" fill="none" stroke="#1f6f5e" stroke-width="8" />
    <path d="M451 128v16M451 224v16M395 184h16M491 184h16M413 146l11 11M478 211l11 11M489 146l-11 11M424 211l-11 11" stroke="#1f6f5e" stroke-width="7" stroke-linecap="round" />
    <text x="451" y="300" font-size="44" font-weight="700">AI</text>

    <rect x="650" y="130" width="184" height="188" rx="18" fill="#fff" stroke="#b94d3f" stroke-width="8" />
    <path d="M688 170h108M688 198h108M688 226h88" stroke="#87928d" stroke-width="8" stroke-linecap="round" />
    <text x="742" y="278" font-size="34" font-weight="700">HTML</text>
    <text x="742" y="312" font-size="24">content</text>
  </g>

  <g fill="none" stroke="#f3f6f5" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M260 121H327" />
    <path d="M260 213H327" />
    <path d="M260 305H327" />
    <path d="M566 220H642" />
  </g>
</svg>
